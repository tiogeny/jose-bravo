<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🥊 Boxing Life</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header>🥊 Boxing Life</header>

  <!-- CARRITO -->
  <div class="carrito">
    🛒 Carrito:
    <span id="cantidad">0</span>
    productos |
    Total: S/
    <span id="total">0</span>
  </div>

  <!-- HERO -->
  <section class="hero">

    <h1>Bienvenido a Boxing Life</h1>

    <h2>
      Encuentra el mejor equipo para subir al ring
    </h2>

    <h3>
      Compra ahora nuestros productos
    </h3>

    <img
      id="ali"
      onclick="cambiarEnergia()"
      src="https://auctions.leski.com.au/images/lot/3760/376058_xl.jpg?ts=1662960066"
      alt="Muhammad Ali"
    />

    <br />

    <button class="btn" onclick="mostrarProductos()">
      Ver productos 🛒
    </button>

  </section>

  <!-- PRODUCTOS -->
  <section id="productos" class="oculto">

    <!-- Protección -->
    <h2>🛡️ Protección</h2>

    <div class="grid">

      <div class="card">
        <img src="https://www.winnendeportes.com/cdn/shop/products/GUANTESDEBOXVENUM12ONZ-ROJO-NEGRO.jpg?v=1669414120" />
        <p>🥊 Guantes</p>
        <span>S/ 120</span>
        <button onclick="agregarCarrito(120)">
          Agregar
        </button>
      </div>

      <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcAVQWlbs3ukx6orGNl1RguN9MFeRIuI9xKw&s" />
        <p>🩹 Vendajes</p>
        <span>S/ 3</span>
        <button onclick="agregarCarrito(3)">
          Agregar
        </button>
      </div>

      <div class="card">
        <img src="https://vincitsports.com/wp-content/uploads/2024/10/bucal_blanco_negro_1-600x600.jpg" />
        <p>🦷 Bucal</p>
        <span>S/ 25</span>
        <button onclick="agregarCarrito(25)">
          Agregar
        </button>
      </div>

    </div>

  </section>

  <footer>
    © 2026 Boxing Life
  </footer>

  <script src="script.js"></script>

</body>

</html>
